name: PR Title

# Conventional Commit PR-title gate (GC-P027, ADR-021 issue #901 amendment). Release
# Please derives the SemVer bump and CHANGELOG from Conventional Commit history on `main`,
# so PR titles must be well-formed: feature PRs squash-merge into `dev` using the PR title
# as the commit subject, and the dev -> main promotion preserves those subjects. This is
# advisory early feedback for the same vocabulary that repository policy and the MCP PR
# creation boundary enforce. Policy checks this file against `.ground-control.yaml`, so
# there is one allow-list rather than two divergent ones. A green title check alone is not
# the whole contract: the repo's merge method must preserve the signal (see
# docs/DEVELOPMENT_WORKFLOW.md § Release model).
#
# This action reads only the PR title via the API (no checkout of PR head), so `pull_request`
# is safe — no untrusted code executes.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-pr-title:
    name: Lint PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Canonical Conventional Commits type allow-list (ADR-021). Kept identical to the
          # /implement local check so the two layers cannot diverge in meaning.
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            build
            ci
            perf
            style
            revert
          # Compound prefixes (security/docs:, fix/refactor:) are rejected: a single type
          # with an optional scope, e.g. fix(policy): ...
          requireScope: false
          # Lowercase-leading subject (ADR-021 issue #901). Reshape acronyms (NGFW, MCP).
          subjectPattern: ^[a-z].*$
          subjectPatternError: |
            The PR title subject must start with a lowercase letter (Conventional Commit
            style, ADR-021). Reshape uppercase acronyms (NGFW, MCP, GCP): lowercase them,
            relocate into a slash-prefixed path, or front with a verb.
          # The Release Please PR (chore(main): release X.Y.Z) and the sync PR
          # (chore: sync main -> dev) both satisfy this contract without an exemption.
