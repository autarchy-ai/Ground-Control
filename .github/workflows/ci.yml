name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # Ground Control is an MCP server over repo-local files (issue #1500): no
  # backend, database, or frontend. The verification surface is the MCP node
  # test suite, the repo policy checks, and Vale prose linting on changed docs.
  policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Fetch PR comments for policy
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | {body: .body, author: .user.login}' \
            > "$RUNNER_TEMP/gc-pr-comments.jsonl"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Show Python version
        run: python3 --version
      # PyYAML backs the required-status-context gate (GC-P030) and the CI
      # workflow-shape tests. It arrives transitively with pre-commit, but a
      # gate must not depend on another tool's dependency graph.
      - name: Install pre-commit and policy dependencies
        run: |
          python3 -m pip install --user pre-commit PyYAML
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Hook environments (including the gitleaks binary) are rebuilt on every
      # run without this, which is most of the hygiene step's wall time. The key
      # is the hook-config hash, so a pinning change always misses the cache and
      # a hit can never serve a hook version other than the pinned one.
      - name: Cache pre-commit hook environments
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Pre-commit file hygiene and secret scan
        run: pre-commit run --all-files
      # The policy tests include a renderer-vs-check_pr_body compose check that
      # spawns `node tools/render_pr_body_fixture.mjs`, which imports the MCP
      # server's lib.js — so the MCP node_modules must be present. Install them
      # before the policy tests, and reuse them for the MCP node test suite.
      - name: Install MCP server deps
        run: npm --prefix mcp/ground-control ci
      - name: Policy tool tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: MCP server tests
        run: npm --prefix mcp/ground-control test
      # ESLint on the MCP server. `make mcp-lint` is the one canonical invocation;
      # `make policy` depends on the same target, so CI and the local guardrail run
      # one command. Deps were installed above by `npm ci`. A lint error fails this
      # already-required job; the existing eslint-plugin-security warnings are advisory.
      - name: MCP ESLint
        run: make mcp-lint
      - name: Repo policy checks
        if: github.event_name == 'pull_request'
        run: >
          python3 bin/policy
          --base "origin/${{ github.base_ref }}"
          --pr-number "${{ github.event.pull_request.number }}"
          --event-path "$GITHUB_EVENT_PATH"
          --pr-comments-json "$RUNNER_TEMP/gc-pr-comments.jsonl"
      - name: Repo policy checks (push)
        if: github.event_name != 'pull_request'
        run: python3 bin/policy --skip-pr-body
      # Vale prose linting (ADR-054). Lints only docs touched in this PR's diff.
      # Skipped on push events because there's no base ref to diff against; the
      # on-PR pass is the authoritative gate (a doc only reaches main via a PR).
      - name: Vale prose lint (changed docs)
        if: github.event_name == 'pull_request'
        run: make vale-lint BASE_REF=origin/${{ github.base_ref }}
