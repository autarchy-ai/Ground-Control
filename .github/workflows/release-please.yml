name: Release Please

# Release Please (issue #1399, ADR-063 "2026-07-15 Amendment", GC-P027) owns product
# versioning, CHANGELOG.md, the annotated vX.Y.Z tag, and the GitHub Release. On each
# push to `main` it maintains a release PR ("chore(main): release X.Y.Z") and regenerates
# CHANGELOG.md from the Conventional Commit history. Merging that PR tags vX.Y.Z and cuts
# the GitHub Release.
#
# After the context-graph teardown (issue #1500) there is no backend image to publish:
# Ground Control is the MCP server over repo-local files, so this workflow no longer builds
# or pushes a GHCR artifact. The release PR is opened by GITHUB_TOKEN, so `dev`'s required
# checks do not auto-run on it — a maintainer reviews and merges it. The main -> dev back-merge is
# handled by sync-main-to-dev.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/maintain the release PR, tag, and Release
      pull-requests: write # maintain the release PR
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
