name: Release Please

# Release Please (issue #1399, ADR-063 "2026-07-15 Amendment", GC-P027) owns product
# versioning, CHANGELOG.md, the annotated vX.Y.Z tag, and the GitHub Release. On each
# push to `main` it maintains a release PR ("chore(main): release X.Y.Z") and regenerates
# CHANGELOG.md from the Conventional Commit history. Merging that PR tags vX.Y.Z and cuts
# the GitHub Release.
#
# Each release also publishes the MCP server and its workflow skills to npm as `grndctl`
# (issue #1587), so hosts install a released version instead of running a checkout. Release
# Please owns the package version through extra-files. Publishing uses npm trusted publishing
# (GitHub OIDC) to stage the package in npm. A maintainer reviews and approves the staged
# package in npm's UI before it becomes publicly installable. The release PR is opened by
# GITHUB_TOKEN, so `dev`'s required
# checks do not auto-run on it — a maintainer reviews and merges it. The main -> dev back-merge is
# handled by sync-main-to-dev.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/maintain the release PR, tag, and Release
      pull-requests: write # maintain the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    defaults:
      run:
        working-directory: mcp/ground-control
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install an npm CLI that supports trusted publishing
        run: npm install -g npm@11.19.1
      - run: npm ci
      - run: npm test
      - name: Stage package with trusted publishing
        run: npm stage publish . --provenance --access public
