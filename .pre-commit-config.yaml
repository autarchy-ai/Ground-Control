fail_fast: true
default_stages: [pre-commit]

repos:
  # =============================================================================
  # STAGE 1: Fast checks (linting, formatting, syntax)
  # =============================================================================

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  # Bash syntax check for the repo's shell entry points.
  - repo: local
    hooks:
      - id: bash-syntax
        name: bash -n (shell scripts)
        entry: bash -c 'for f in "$@"; do bash -n "$f" || exit 1; done' --
        language: system
        files: ^(scripts/.*\.sh|bin/install-skills\.sh|tools/.*\.sh)$

  # =============================================================================
  # STAGE 2: Security
  # =============================================================================

  # Secrets detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  # Full tests, repository policy, prose lint, and PR-body validation run in CI.
  # Commit checks inspect staged files; push does not repeat the hook set.
