schema_version: 1
project: ground-control
github_repo: autarchy-ai/Ground-Control
# Strict Sonar gate: with this block present the /implement monitor (Step 11)
# enforces the SonarCloud result as a hard gate — quality gate OK AND zero open
# issues AND zero open hotspots — instead of skipping it. Without it the gate was
# a silent no-op, so open issues never failed a publish (issue #1495 follow-up).
sonarcloud:
  project_key: autarchy-ai_Ground-Control
  organization: autarchy-ai
workflow:
  # Ground Control is the MCP server for the /implement workflow over repo-local
  # files (issue #1500): no backend, database, or frontend. The repo's test gate
  # is the MCP node suite; the policy gate is `make policy` (the normalized
  # default, so policy_command is intentionally omitted).
  test_command: make mcp-test
  completion_command: make mcp-test
  verification:
    # Content-addressed reuse binds the JavaScript/Python toolchains and the
    # dependency/configuration files consumed by the completion and policy gates.
    toolchain_fingerprint_command: node tools/verification-fingerprint.mjs
  codex_review:
    pre_push_cap: 1
  test_quality_review:
    pre_push_cap: 1
  # The advisory PR-title workflow and the privileged MCP PR-creation boundary
  # consume this same contract; make policy rejects drift between them.
  pr_title:
    types: [feat, fix, docs, chore, refactor, test, build, ci, perf, style, revert]
    require_scope: false
    subject_pattern: '^[a-z].*$'
  # Exactly one codex cycle and one test-quality cycle per issue. The
  # auto-disposition gate is off, so nothing can grant an over-cap cycle on its
  # own; only an explicit human override_cap does.
  #
  # Both blocks also accept non_verdict_retry_limit (#1476), a different axis
  # from pre_push_cap: it bounds automatic re-attempts when a station renders NO
  # verdict (timeout, dead engine, unparseable output, incomplete slice
  # coverage). Bounds [0, 2], default 1; left unset here because 1 is the default.
  review_disposition:
    enabled: false
    mode: shadow
    max_auto_overrides: 0
    judge:
      enabled: false
rules:
  plan_rules: .gc/plan-rules.md
knowledge:
  dir: docs/knowledge
docs:
  adr_dir: architecture/adrs/
  architecture_overview: docs/architecture/ARCHITECTURE.md
  coding_standards: docs/CODING_STANDARDS.md
  workflow_reference: docs/DEVELOPMENT_WORKFLOW.md
  knowledge_base: docs/knowledge/
example_paths:
  source: mcp/ground-control/
  test: mcp/ground-control/
requirements:
  uid_examples:
    - GC-X001
    - OBS-042
cross_cutting_concerns:
  description: |
    Runtime: Node.js ES modules (mcp/ground-control), zod for tool input schemas
    Requirements/ADRs: repo-local files — docs/requirements/<UID>/requirement.md, architecture/adrs/*.md
    Privileged side effects: gh/git argv-based calls from the MCP server only, never from codex/claude sandboxes (ADR-027)
    Durable record: the GitHub issue thread — decision records, phase markers, plan, and final report (ADR-029)
    Tests: node --test suites at mcp/ground-control/*.test.js; Python unittest for repo policy tooling under tools/tests/
    Policy: repo-native checks via `make policy` (tools/policy + bin/policy), shared by Claude and Codex
# Per ADR-036 — opt in to /implement cost reduction. Routing resolves
# stage/purpose names to concrete agent/model choices.
routing:
  enabled: true
  default_provider: claude
  stages:
    issue_branch_resolution:
      tier: low
      model: claude-haiku-4-5
    read_issue_context:
      tier: low
      model: claude-haiku-4-5
    architecture_preflight:
      tier: low
      model: claude-haiku-4-5
    codebase_assessment:
      tier: medium
      model: claude-sonnet-5
    planning:
      tier: high
      model: claude-opus-4-8
    implementation:
      tier: medium
      model: claude-sonnet-5
    clause_mapping:
      tier: medium
      model: claude-sonnet-5
    precommit:
      tier: low
      model: claude-haiku-4-5
    completion_gate:
      tier: low
      model: claude-haiku-4-5
    review_cycle_1_consume:
      tier: high
      model: claude-opus-4-8
    review_fix_application:
      tier: medium
      model: claude-sonnet-5
    git_publish:
      tier: low
      model: claude-haiku-4-5
    base_sync:
      tier: low
      model: claude-haiku-4-5
    pr_body:
      tier: low
      model: claude-haiku-4-5
    ci_monitor:
      tier: low
      model: claude-haiku-4-5
    test_quality_review:
      tier: medium
      model: claude-sonnet-5
    transition_reconcile:
      tier: medium
      model: claude-sonnet-5
    final_report:
      tier: low
      model: claude-haiku-4-5
    close_issue_after_merge:
      tier: low
      model: claude-haiku-4-5
# Repo design vocabulary (#931). The principal-engineer rubric in the codex
# preflight + pre-push reviewers consumes this when present and falls back to
# workflow-level defaults when absent. Per-repo content; nothing here is
# hardcoded into the workflow.
architecture:
  vocabulary:
    patterns:
      - name: Tool registration
        applies_to: MCP tool surface; zod input schema + thin handler delegating to a lib function
        example_path: mcp/ground-control/tools/query.js
      - name: Requirement file reader
        applies_to: reads docs/requirements/<UID>/requirement.md; the exporter shape is the write contract
        example_path: mcp/ground-control/lib/requirement-files.js
      - name: Issue-thread record
        applies_to: gh api argv posting of plans/decisions/final reports to the GitHub issue
        example_path: mcp/ground-control/lib/doc-coverage-2.js
    canonical_helpers:
      - name: gh api argv-based posting in mcp/ground-control/lib.js
        purpose: privileged GitHub side effects from the MCP server, not from codex/claude sandboxes (ADR-027)
      - name: requirement-files.js reader
        path: mcp/ground-control/lib/requirement-files.js
        purpose: repo-local requirement reads (ADR-093); there is no backend
    boundary_contract:
      description: |
        The MCP server is the only running service and owns every privileged gh/git side effect.
        Requirements and ADRs are repo-local files the agent reads and edits directly, reviewed in the PR.
    binding_adrs:
      - id: ADR-027
        one_liner: .ground-control.yaml + gc_get_repo_ground_control_context are the agent-neutral context contract; nothing else reads the file
      - id: ADR-029
        one_liner: the GitHub issue thread is the durable workflow record (decision records, phase markers, final report)
      - id: ADR-031
        one_liner: codex returns structured findings; the MCP server performs the GitHub writes
      - id: ADR-093
        one_liner: requirements are repo-local files (docs/requirements/<UID>/requirement.md), not a backend/graph record (issue #1500)
      - id: ADR-094
        one_liner: Graphify is an optional, not-required code+docs comprehension index (issue #1500)
    anti_recommendations:
      - Do not introduce new abstractions below 3 call-sites — three similar lines beat a premature abstraction
      - Do not add prompt text in skills/implement/SKILL.md that the MCP tools cannot enforce — the tool layer is the trust boundary
      - Do not add comments that restate what the code obviously does; reserve comments for non-obvious WHY (constraints, invariants, workaround context)
      - Do not invoke `gh` / `git` / `curl` from codex or claude sandboxes — the MCP server owns the privileged side effects (ADR-027)
